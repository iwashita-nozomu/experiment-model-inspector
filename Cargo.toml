[package]
name = "experiment-model-inspector"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Read-only evidence-linked experiment model and data-flow inspector"
repository = "https://github.com/iwashita-nozomu/experiment-model-inspector"

[dependencies]
cap-std = "3.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[profile.release]
lto = true
strip = true
codegen-units = 1
